version: "2"
sql:
  - engine: postgresql
    # sqlc understands goose annotations and ignores the Down sections.
    schema: migrations
    queries: queries
    strict_function_checks: false
    gen:
      go:
        package: db
        out: internal/database/db
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        rename:
          source_ip: SourceIP
          ip_address: IPAddress
          network_cidr: NetworkCIDR
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true

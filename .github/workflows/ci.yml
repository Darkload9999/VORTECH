# Backend CI: runs on every pull request and on pushes to main.
#
# Security posture:
# - `pull_request` (not `pull_request_target`): fork PRs run without secrets
#   and with a read-only token, so untrusted code can never publish or deploy.
# - Third-party actions are pinned to full commit SHAs (tag in the comment);
#   Dependabot proposes updates.
# - Nothing is deployed or pushed from CI yet; image publishing arrives with
#   the infrastructure phase and will run only for trusted refs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

env:
  # Always the newest patch release of the Go line in go.mod: go.mod states
  # only the minimum (1.26.0), and building with an old patch release ships
  # standard-library vulnerabilities that govulncheck (rightly) flags.
  GO_VERSION: "1.26.x"
  # Integration tests skip the live-Keycloak end-to-end suite when empty;
  # everything else (including PostgreSQL integration tests) runs.
  TEST_KEYCLOAK_URL: ""

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: sqlc generated code is current
        run: make sqlc-check

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vortech
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: vortech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vortech -d vortech"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://vortech:ci_only_password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Unit tests (race)
        run: make test
      - name: Integration tests (PostgreSQL)
        run: make test-integration

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        run: make vuln

  image:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: vortech/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

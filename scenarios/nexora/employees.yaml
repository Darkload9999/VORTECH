# NEXORA staff. All people are fictional. Each employee is a deterministic NPC
# with a fictional directory identity (<username>@nexora.local); these are game
# data, never real platform accounts.
#
# Schedule entries without a location use the employee's home location.

x-schedules:
  office: &office
    - { days: [weekdays], from: "09:00", to: "12:00", activity: working }
    - { days: [weekdays], from: "12:00", to: "13:00", activity: break }
    - { days: [weekdays], from: "13:00", to: "17:30", activity: working }
  early: &early
    - { days: [weekdays], from: "07:30", to: "12:00", activity: working }
    - { days: [weekdays], from: "12:00", to: "12:30", activity: break }
    - { days: [weekdays], from: "12:30", to: "16:00", activity: working }
  soc_day: &soc_day
    - { days: [mon, tue, wed, thu], from: "07:00", to: "19:00", activity: on_call }
  soc_swing: &soc_swing
    - { days: [thu, fri, sat, sun], from: "07:00", to: "19:00", activity: on_call }


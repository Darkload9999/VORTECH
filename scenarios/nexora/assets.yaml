# NEXORA digital estate. Hosts join networks with `network:` (CONNECTED_TO),
# applications run on servers via `hosted_on:` (HOSTED_ON) and declare
# `depends_on:` (DEPENDS_ON). Ownership, identities and group memberships
# come from employees.yaml. Extra digital-twin edges go in `relationships:`.
# The servers WEB01, APP01, DB01, GIT01 and JUMP01 are replicated inside each
# player's isolated cyber range.


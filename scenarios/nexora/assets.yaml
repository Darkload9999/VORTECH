relationships:
  # Network paths beyond simple segment membership.
  - { from: "asset:NET-DEV-VPN01", type: CONNECTED_TO, to: "asset:NET-CORP-SERVERS" }
  - { from: "asset:NET-DEV-FW-BR01", type: CONNECTED_TO, to: "asset:NET-DEV-FW-HQ01" }
  - { from: "asset:SRV-HQ-JUMP01", type: HAS_ACCESS_TO, to: "asset:NET-CORP-SERVERS" }
  # Authentication and data flows.
  - { from: "asset:APP-PORTAL", type: AUTHENTICATES_TO, to: "asset:SRV-HQ-DC01" }
  - { from: "asset:APP-LEDGER", type: AUTHENTICATES_TO, to: "asset:SRV-HQ-DC01" }
  - { from: "asset:SRV-HQ-BACKUP01", type: DEPENDS_ON, to: "asset:CLOUD-S3-BACKUPS" }
  - { from: "asset:SRV-HQ-SIEM01", type: DEPENDS_ON, to: "asset:SRV-HQ-DC01" }
  # Groups granting access.
  - { from: "asset:GRP-FINANCE", type: HAS_ACCESS_TO, to: "asset:APP-LEDGER" }
  - { from: "asset:GRP-HR", type: HAS_ACCESS_TO, to: "asset:APP-PEOPLEDESK" }
  - { from: "asset:GRP-VPN-USERS", type: HAS_ACCESS_TO, to: "asset:NET-DEV-VPN01" }
  - { from: "asset:GRP-DOMAIN-ADMINS", type: MANAGES, to: "asset:SRV-HQ-DC01" }
  - { from: "asset:GRP-IT-ADMINS", type: HAS_ACCESS_TO, to: "asset:SRV-HQ-JUMP01" }
  - { from: "asset:GRP-SOC-ANALYSTS", type: HAS_ACCESS_TO, to: "asset:APP-WATCHTOWER" }
